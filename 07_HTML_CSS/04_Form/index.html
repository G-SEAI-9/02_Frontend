<!DOCTYPE html>
<html lang="de">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmeldung Coding School</title>
  </head>

  <body>

    <header>

      <h1>Komm zur Coding School</h1>
      <p>Ein aufregender Weg erwartet Dich!</p>
    </header>


    <main>

      <form>

        <!-- Persönliche Infos  -->
        <fieldset>
          <legend>Persönliche Informationen</legend>

          <div>
            <label for="vorname">Vorname</label>
            <input type="text" name="vorname" id="vorname" placeholder="Anna" autocomplete="given-name"
              required><span>*</span>
          </div>
          <div>
            <label for="nachname">Nachname</label>
            <input type="text" name="nachname" id="nachname" placeholder="Meier" autocomplete="family-name" required>
            <span>*</span>
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="anna.meier@mail.com" autocomplete="email" required>
            <span>*</span>
          </div>
          <div>
            <label for="phone">Telefon</label>
            <input type="phone" name="phone" id="phone" placeholder="+49123456789" autocomplete="tel" required>
            <span>*</span>
          </div>
        </fieldset>

        <!-- Adresse -->
        <fieldset>
          <legend>Adresse<span>*</span></legend>

          <div>
            <label for="street-address">Straße und Hausnummer</label>
            <input type="text" name="street-address" id="street-address" placeholder="Berliner Str. 1"
              autocomplete="street-address" required>
          </div>
          <div>
            <label for="plz">PLZ</label>
            <input type="text" name="plz" id="plz" pattern="[0-9]{5}" placeholder="01234" autocomplete="postal-code"
              required>
          </div>
          <div>
            <label for="city">Ort</label>
            <input type="text" name="city" id="city" placeholder="München" autocomplete="address-level2" required>
          </div>
        </fieldset>


        <!-- Fragen zum Kurs -->
        <fieldset>
          <legend>Wähle deinen Kurs</legend>


          <div>
            <label for="kurs">Kurse</label>
            <select name="kurs" id="kurs" required>
              <option value="" selected disabled>-- Wähle bitte einen aus --</option>
              <option value="se">Software Engineering</option>
              <option value="wd">WebDevelopment</option>
              <option value="ui">UI/UX Design</option>
              <option value="ki">KI für Buisiness</option>
              <option value="ds">DataScience</option>
            </select>
          </div>


          <div>

            <p>Welchen Editor bevorzugst du?</p>

            <input type="radio" id="vscode" name="editor" value="vscode">
            <label for="vscode">VS Code</label>

            <input type="radio" id="zed" name="editor" value="zed">
            <label for="zed">Zed</label>

            <input type="radio" id="nvim" name="editor" value="nvim">
            <label for="nvim">Neovim</label>


            <!-- <input type="date" name="" id=""> -->
            <!-- <input type="color" name="" id=""> -->
            <!-- <input type="range" name="" id="" min="10" max="100"> -->
          </div>


        </fieldset>


        <!-- Zustimmungen und Abschicken -->
        <fieldset>
          <legend>Los geht's</legend>
          <input type="checkbox" name="terms" id="terms" required>
          <label for="terms">Ich habe die <a href="datenschutz.pdf" download="">Datenschutzbestimmungen</a> und die <a
              href="agb.pdf" download>AGB</a> gelesen und
            stimme ihnen zu!</label>


          <div>
            <button type="submit">Abschicken</button>
            <button type="reset">Zurücksetzen</button>
            <button type="button">yolo</button>
          </div>

        </fieldset>

      </form>
    </main>
  </body>

</html>
