<!DOCTYPE html>

  <head>
    <meta charset="UTF-8">

      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">

      rel="stylesheet">


    <link rel="stylesheet" href="style.css">
    <title>Kontakt | Coffe Brazil</title>
  </head>

  <body>

    <header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">Über uns</a></li>
          <li><a href="contact.html">Kontakt</a></li>
        </ul>
      </nav>
    </header>
    <h1>Schreib uns!</h1>

    <main>

      <div>
        <ul>
          <li>Anrufen: <a href="tel:+491234567890">0123/4567890</a></li>
          <li>Mailen: <a href="mailto:coffe@brazil.de">coffe@brazil.de</a></li>
        </ul>
      </div>

      <form class="contact-form">
        <fieldset>
          <legend>Hinterlasse uns eine Nachricht</legend>
          <div>
            <label for="name">Name</label>
            <input type="text" name="username" id="name">
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email">
          </div>
          <div>
            <label for="message">Deine Nachricht</label>
            <textarea name="username" id="message" placeholder="Carpe Diem!"></textarea>
          </div>
          <button type="submit">Abschicken</button>
        </fieldset>
      </form>

    </main>

  </body>

</html>
