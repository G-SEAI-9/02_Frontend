<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Windows Nostalgia</title>
  </head>

  <body>
    <!-- BEM: Block-Element-Modifier -->

    <div class="window">
      <!-- header: Kernel Panic -->
      <header class="window__header">
        <h2 class="window__heading">Kernel panic</h2>
      </header>
      <!-- <div class="window__border"></div> -->

      <!-- Box mit Icon, meldung und button -->

      <div class="window__content">

        <div class="window__message">
          <img class="window__img" src="https://i.postimg.cc/wTQJ3hgb/error.png" width="20" height="20" alt=""
            draggable="false" />
          <p class="window__para">Please shut down your computer, and go for a walk.</p>
        </div>

        <button class="btn window__btn" type="button">Cancel</button>
      </div>

    </div>
  </body>

</html>
