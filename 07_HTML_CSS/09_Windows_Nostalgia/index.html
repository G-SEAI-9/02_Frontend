<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Windows Nostalgia</title>
  </head>

  <body>
    <!-- BEM: Block-Element-Modifier
         Eine Namenskonvention für Klassen, damit man am Namen sieht, wozu etwas gehört:
         - Block:    ein eigenständiger Baustein            -> .window
         - Element:  ein Teil, das nur im Block Sinn ergibt  -> .window__header (zwei Unterstriche)
         - Modifier: eine Variante von Block oder Element    -> .btn--danger (zwei Bindestriche)
         Vorteil: flache, eindeutige Klassennamen — kein Rätselraten und keine
         verschachtelten Selektoren wie ".window header h2". -->

    <!-- Block: das Fenster. Alles darin ist ein Element davon. -->
    <div class="window">
      <!-- header: Kernel Panic -->
      <!-- Element: gehört zum Block "window", darum window__header -->
      <header class="window__header">
        <h2 class="window__heading">Kernel panic</h2>
      </header>
      <!-- <div class="window__border"></div> -->

      <!-- Box mit Icon, meldung und button -->

      <div class="window__content">

        <div class="window__message">
          <img class="window__img" src="https://i.postimg.cc/wTQJ3hgb/error.png" width="20" height="20" alt=""
            draggable="false" />
          <p class="window__para">Please shut down your computer, and go for a walk.</p>
        </div>

        <!-- Zwei Klassen: "btn" ist der wiederverwendbare Block (Aussehen aller Buttons),
             "window__btn" positioniert genau diesen Button im Fenster. -->
        <button class="btn window__btn" type="button">Cancel</button>
      </div>

    </div>
  </body>

</html>
